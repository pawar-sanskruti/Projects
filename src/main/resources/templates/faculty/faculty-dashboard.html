<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Faculty Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">Faculty Dashboard</span>

    <a th:href="@{/logout}" class="btn btn-sm btn-light">
        Logout
    </a>
</nav>

<div class="container my-5">
    <div class="row g-4 justify-content-center">

        <!-- Hall Allocation -->
        <div class="col-md-5">
            <div class="card p-4 text-center bg-primary text-white">
                <h3>🏫 Hall Allocation</h3>

                <a th:href="@{/faculty/halls}"
                   class="btn btn-light mt-3">
                    View Halls
                </a>
            </div>
        </div>

        <!-- Student List -->
        <div class="col-md-5">
            <div class="card p-4 text-center bg-dark text-white">
                <h3>👥 Student List</h3>

                <a th:href="@{/faculty/students}"
                   class="btn btn-light mt-3">
                    View Students
                </a>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>




<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Generate Seating</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: linear-gradient(to right, #e3f2fd, #ffffff); }
        .card { border-radius: 20px; }
        .card-header { border-radius: 20px 20px 0 0; }
    </style>
</head>

<body>

<div class="container mt-5">
    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white text-center">
            Generate Seating Arrangement
        </div>

        <div class="card-body">

            <form th:action="@{/admin/generate-seating}" method="post">

                <div class="row g-3">

                    
                    <div class="col-md-6">
                        <label>Exam</label>
                        <select name="examId" id="examSelect" class="form-select" required>
                            <option value="">Select</option>
                            <option th:each="e:${exams}"
                                    th:value="${e.examId}"
                                    th:text="${e.examName}"
                                    th:data-date="${e.examDate}"
                                    th:data-start="${e.startTime}"
                                    th:data-end="${e.endTime}"
									th:data-session="${e.session}"
									>
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label>Exam Name</label>
                        <input type="text" id="examName" class="form-control" readonly>
                    </div>

                    <div class="col-md-6">
                        <label>Exam Date</label>
                        <input type="text" id="examDate" class="form-control" readonly>
                    </div>

                    <div class="col-md-6">
                        <label>Exam Time</label>
                        <input type="text" id="examTime" class="form-control" readonly>
                    </div>
					<div class="col-md-6">
					    <label>Session</label>
					    <input type="text" id="examSession" class="form-control" readonly>
					</div>

                    
                    <div class="col-md-6">
                        <label>Hall</label>
                        <select name="hallId" class="form-select" required>
                            <option value="">Select</option>
                            <option th:each="h:${halls}" th:value="${h.hallId}"
                                    th:text="${h.hallName + ' (' + h.capacity + ')'}"></option>
                        </select>
                    </div>

                    
                    <div class="col-12 mt-3">
                        <h5 class="text-primary">Class 1</h5><hr>
                    </div>

                    <div class="col-md-6">
                        <label>Class</label>
                        <select name="class1Id" class="form-select" required>
                            <option value="">Select</option>
                            <option th:each="c:${classes}" th:value="${c.classId}" th:text="${c.className}"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label>Subject</label>
                        <select name="subject1Id" id="subject1" class="form-select" required>
                            <option value="">Select</option>
                            <option th:each="s:${subjects}"
                                    th:value="${s.subjectId}"
                                    th:text="${s.subjectName + ' (' + s.subjectCode + ')'}"
                                    th:data-code="${s.subjectCode}"
                                    th:data-sem="${s.semester}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label>Subject Code</label>
                        <input type="text" id="code1" class="form-control" readonly>
                    </div>

                    <div class="col-md-6">
                        <label>Semester</label>
                        <input type="text" id="sem1" class="form-control" readonly>
                    </div>

                    
                    <div class="col-12 mt-3">
                        <input type="checkbox" id="enableClass2"> Add Second Class
                    </div>

                    <div id="class2Section" style="display:none;">

                        <div class="col-12 mt-3">
                            <h5 class="text-success">Class 2</h5><hr>
                        </div>

                        <div class="col-md-6">
                            <label>Class</label>
                            <select name="class2Id" id="class2Id" class="form-select">
                                <option value="">Select</option>
                                <option th:each="c:${classes}" th:value="${c.classId}" th:text="${c.className}"></option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label>Subject</label>
                            <select name="subject2Id" id="subject2" class="form-select">
                                <option value="">Select</option>
                                <option th:each="s:${subjects}"
                                        th:value="${s.subjectId}"
                                        th:text="${s.subjectName + ' (' + s.subjectCode + ')'}"
                                        th:data-code="${s.subjectCode}"
                                        th:data-sem="${s.semester}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label>Subject Code</label>
                            <input type="text" id="code2" class="form-control" readonly>
                        </div>

                        <div class="col-md-6">
                            <label>Semester</label>
                            <input type="text" id="sem2" class="form-control" readonly>
                        </div>

                    </div>

                </div>

                <div class="mt-4">
                    <button class="btn btn-success w-100">Generate Seating</button>
                </div>

            </form>

        </div>
    </div>
</div>

<script>


document.getElementById("examSelect").addEventListener("change", function () {

    let selected = this.options[this.selectedIndex];

    document.getElementById("examName").value = selected.text;
    document.getElementById("examDate").value = selected.getAttribute("data-date") || "";

    let start = selected.getAttribute("data-start");
    let end = selected.getAttribute("data-end");

    document.getElementById("examTime").value =
        (start && end) ? start + " - " + end : "";
		
		let session = selected.getAttribute("data-session");
		    document.getElementById("examSession").value = session || "";
});



document.getElementById("subject1").addEventListener("change", function () {

    let selected = this.options[this.selectedIndex];

    document.getElementById("code1").value = selected.getAttribute("data-code") || "";
    document.getElementById("sem1").value = selected.getAttribute("data-sem") || "";
});



document.getElementById("subject2").addEventListener("change", function () {

    let selected = this.options[this.selectedIndex];

    document.getElementById("code2").value = selected.getAttribute("data-code") || "";
    document.getElementById("sem2").value = selected.getAttribute("data-sem") || "";
});



document.getElementById("enableClass2").addEventListener("change", function () {

    let section = document.getElementById("class2Section");
    let class2 = document.getElementById("class2Id");
    let subject2 = document.getElementById("subject2");

    if (this.checked) {
        section.style.display = "flex";
        section.style.flexWrap = "wrap";

        class2.setAttribute("required", "true");
        subject2.setAttribute("required", "true");

    } else {
        section.style.display = "none";

        class2.removeAttribute("required");
        subject2.removeAttribute("required");

        class2.value = "";
        subject2.value = "";
    }
});

</script>

</body>
</html>

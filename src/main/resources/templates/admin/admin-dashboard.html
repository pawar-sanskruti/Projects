<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>
<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 sidebar p-3 bg-dark">
            <h4 class="text-white mb-4">🎓 Modern College</h4>
            <ul class="nav flex-column">
                <li><a class="nav-link text-white" th:href="@{/admin/dashboard}">Dashboard</a></li>
                <li><a class="nav-link text-white" th:href="@{/admin/add-student}">Add Student</a></li>
                <li><a class="nav-link text-white" th:href="@{/admin/add-hall}">Add Exam Hall</a></li>
                <li><a class="nav-link text-white" th:href="@{/admin/view-halls}">View Halls</a></li>
                <li><a class="nav-link text-white" th:href="@{/admin/schedule-exam}">Schedule Exam</a></li>
                <li><a class="nav-link text-white" th:href="@{/admin/generate-seating}">Generate Seating</a></li>
                <li><a class="nav-link text-white" th:href="@{/admin/view-seating}">View Seating</a></li>
            </ul>
        </nav>
       
        <!-- Main -->
        <main class="col-md-9 col-lg-10 px-4">

            <div class="d-flex justify-content-between align-items-center py-3">
                <h3>Welcome, Admin</h3>

                <div>
                    <!-- ✅ Upload Button 
                    <button class="btn btn-success btn-sm me-2" data-bs-toggle="modal" data-bs-target="#uploadModal">
                        Upload CSV
                    </button>-->

                    <a th:href="@{/logout}" class="btn btn-sm btn-outline-dark">Logout</a>
                </div>
            </div>

            <!-- ✅ Success/Error Message -->
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <!-- Stats -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
					<!--
                    <div class="card p-3 bg-primary text-white">
                        <h5>Students</h5>
                        <h2 th:text="${studentCount}">0</h2>
                    </div>-->
					<a th:href="@{/admin/students}" style="text-decoration:none;">
					    <div class="card p-3 bg-primary text-white">
					        <h5>Students</h5>
					        <h2 th:text="${studentCount}">0</h2>
					    </div>
					</a>
					
                </div>
                <div class="col-md-4">
                    <div class="card p-3 bg-success text-white">
                        <h5>Exam Halls</h5>
                        <h2 th:text="${hallCount}">0</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3 bg-dark text-white">
                        <h5>Exams</h5>
                        <h2 th:text="${examCount}">0</h2>
                    </div>
                </div>
            </div>

            <!-- Table -->
			<div class="card">
			    <div class="card-header fw-bold">Recent Seating Arrangements</div>
			    <div class="card-body table-responsive">
			        <table class="table table-bordered">
			            <thead>
			            <tr>
			                <th>Exam</th>
			                <th>Date</th>
			                <th>Subject</th>
			                <th>Hall</th>
			            </tr>
			            </thead>

			            <tbody>
			            <tr th:each="seat : ${recentSeating}">
			                <td th:text="${seat.examName}"></td>
			                <td th:text="${seat.examDate}"></td>
			                <td th:text="${seat.subjectName}"></td>
			                <td th:text="${seat.hallName}"></td>
			            </tr>

			            <tr th:if="${#lists.isEmpty(recentSeating)}">
			                <td colspan="4" class="text-center text-muted">No seating generated yet</td>
			            </tr>
			            </tbody>
			        </table>
			    </div>
			</div>

        </main>
    </div>
</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5>Upload Students CSV</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

           
            <form th:action="@{/admin/students/upload}" method="post" enctype="multipart/form-data">

                <div class="modal-body">
                    <input type="file" name="file" class="form-control" accept=".csv" required>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-primary">Upload</button>
                </div>

            </form>

        </div>
    </div>
</div>-->

</body>
</html>

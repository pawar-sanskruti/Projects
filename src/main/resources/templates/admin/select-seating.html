<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Select Seating</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
    <div class="card p-4 shadow">

        <h4>Select Exam & Hall</h4>

        <form th:action="@{/admin/view-seating}" method="get">

            <!-- Exam -->
            <div class="mb-3">
                <label>Exam</label>
                <select name="examId" class="form-select" required>
                    <option value="">Select Exam</option>
                    <option th:each="e : ${exams}"
                            th:value="${e.examId}"
                            th:text="${e.examName}">
                    </option>
                </select>
            </div>

            <!-- Hall -->
            <div class="mb-3">
                <label>Hall</label>
                <select name="hallId" class="form-select" required>
                    <option value="">Select Hall</option>
                    <option th:each="h : ${halls}"
                            th:value="${h.hallId}"
                            th:text="${h.hallName}">
                    </option>
                </select>
            </div>

            <button class="btn btn-primary w-100">View Seating</button>

        </form>

    </div>
</div>

</body>
</html>

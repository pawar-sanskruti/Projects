<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Schedule Exam</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #eef2f3, #dfe9f3);
        }
        .card {
            border-radius: 15px;
        }
        .form-control {
            border-radius: 10px;
        }
        .btn {
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <div class="card shadow-lg p-4">

        <h3 class="text-center mb-4 text-primary">📅 Schedule Exam</h3>

        <form th:action="@{/admin/save-exam}" th:object="${exam}" method="post">

            <!-- Exam Name -->
            <div class="mb-3">
                <label class="form-label">Exam Name</label>
                <input type="text" th:field="*{examName}" class="form-control" placeholder="Enter exam name" required>
            </div>

            <!-- Date -->
            <div class="mb-3">
                <label class="form-label">Exam Date</label>
                <input type="date" th:field="*{examDate}" class="form-control" required>
            </div>

            <!-- Time Row -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Start Time</label>
                    <input type="time" th:field="*{startTime}" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">End Time</label>
                    <input type="time" th:field="*{endTime}" class="form-control" required>
                </div>
            </div>

            <!-- Session -->
            <div class="mb-3">
                <label class="form-label">Session</label>
                <select th:field="*{session}" class="form-control" required>
                    <option value="">Select Session</option>
                    <option value="Morning">Morning</option>
                    <option value="Afternoon">Afternoon</option>
                    <option value="Evening">Evening</option>
                </select>
            </div>

            <!-- Submit -->
            <button class="btn btn-primary w-100 fw-bold">Save Exam</button>

        </form>

    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Exam Hall</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            min-height: 100vh;
        }

        .card {
            border-radius: 15px;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-primary {
            border-radius: 10px;
            background: linear-gradient(45deg, #007bff, #00c6ff);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(45deg, #0056b3, #0096c7);
        }

        .icon-box {
            font-size: 40px;
            color: #007bff;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4 col-md-5">

        <!-- Header -->
        <div class="text-center mb-4">
            <div class="icon-box mb-2">
                <i class="bi bi-building"></i>
            </div>
            <h3 class="fw-bold">Add Exam Hall</h3>
            <p class="text-muted">Enter hall details below</p>
        </div>

        <!-- Form -->
        <form th:action="@{/admin/save-hall}" th:object="${hall}" method="post">

            <div class="mb-3">
                <label class="form-label fw-semibold">Hall Name</label>
                <input type="text" th:field="*{hallName}" class="form-control" placeholder="Enter Hall Name" required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Capacity</label>
                <input type="number" th:field="*{capacity}" class="form-control" placeholder="Enter Seating Capacity" required>
            </div>

            <button class="btn btn-primary w-100">
                <i class="bi bi-save"></i> Save Hall
            </button>

        </form>

    </div>
</div>                        

</body>
</html>

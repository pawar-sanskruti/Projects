<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Exam Halls</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
	<p class="text-muted mb-0">
	            Total Halls: 
	            <span class="badge bg-dark fs-6" th:text="${totalHalls}"></span>
	        </p>

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            min-height: 100vh;
        }

        .card {
            border-radius: 15px;
        }

        .table thead {
            background: linear-gradient(45deg, #007bff, #00c6ff);
            color: white;
        }

        .btn-primary {
            background: linear-gradient(45deg, #007bff, #00c6ff);
            border: none;
            border-radius: 10px;
        }

        .btn-danger {
            border-radius: 8px;
        }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-icon {
            font-size: 28px;
            color: #007bff;
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <div class="card shadow p-4">

         
        <div class="header-box mb-4">
            <div>
                <h3 class="fw-bold">
                    <i class="bi bi-building title-icon"></i> Exam Halls
                </h3>
                <p class="text-muted mb-0">Manage your exam halls</p>
            </div>
			
			

            <a th:href="@{/admin/add-hall}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Add Hall
            </a>
        </div>
		

        <!-- Table -->
        <div class="table-responsive">
            <table class="table table-hover text-center align-middle">

                <thead>
                    <tr>
                        <th>Hall Name</th>
                        <th>Capacity</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="h : ${halls}">
                        <td class="fw-semibold" th:text="${h.hallName}"></td>
                        <td>
                            <span class="badge bg-success fs-6 px-3 py-2"
                                  th:text="${h.capacity}"></span>
                        </td>
                        <td>
                            <a th:href="@{/admin/delete-hall/{id}(id=${h.hallId})}"
                               class="btn btn-sm btn-danger">
                                <i class="bi bi-trash"></i> Delete
                            </a>
                        </td>
                    </tr>

                    <!-- Empty State -->
                    <tr th:if="${#lists.isEmpty(halls)}">
                        <td colspan="3" class="text-muted">No halls available</td>
                    </tr>
                </tbody>

            </table>
        </div>

    </div>
</div>

</body>
</html>

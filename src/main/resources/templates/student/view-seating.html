<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Seating Arrangement</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
            font-size: 14px;
        }

        .main-box {
            border: 1px solid black;
            background: white;
        }

        .header {
            text-align: center;
            font-weight: bold;
            background: #d9ead3;
            border-bottom: 1px solid black;
        }

        .sub-header {
            text-align: center;
            font-weight: bold;
            background: #e2f0d9;
            border-bottom: 1px solid black;
        }

        .info-row {
            border-bottom: 1px solid black;
            padding: 5px;
        }

        .info-row span {
            color: red;
            font-weight: bold;
        }

        table {
            width: 100%;
        }

        th, td {
            border: 1px solid black;
            text-align: center;
            padding: 6px;
        }

        th {
            background: #f2f2f2;
            font-style: italic;
        }

        .empty-seat {
            color: #bbb;
        }
    </style>
</head>

<body>

<div class="container mt-3">

    <!-- ✅ NO DATA MESSAGE -->
    <div th:if="${seatingList == null or seatingList.isEmpty()}">
        <div class="alert alert-warning text-center">
            No Seating Assigned Yet
        </div>
    </div>

    <!-- ✅ MAIN CONTENT -->
    <div th:if="${seatingList != null and !seatingList.isEmpty()}" class="main-box">

        <!-- Header -->
        <div class="header p-2">
            <div>Modern College of ASC, Ganeshkhind, Pune 16</div>
            <div th:text="${seatingList[0].exam_name}"></div>
        </div>

        <div class="sub-header p-1">
            <span th:text="${seatingList[0].session}"></span> Session (NEP)
        </div>

        <!-- Info Section -->
        <div class="row info-row">
            <div class="col-md-4">
                Date : <span th:text="${seatingList[0].exam_date}"></span>
            </div>
            <div class="col-md-4">
                Class : <span th:text="${seatingList[0].class_name}"></span>
            </div>
            <div class="col-md-4 text-end"></div>
        </div>

        <div class="row info-row">
            <div class="col-md-6">
                Sub : <span th:text="${seatingList[0].subject_name}"></span>
            </div>
            <div class="col-md-6 text-end">
                Room No : <span th:text="${seatingList[0].hall_name}"></span>
            </div>
        </div>

        <div class="row info-row">
            <div class="col-md-6">
                Sub Code :- <span th:text="${seatingList[0].subject_code}"></span>
            </div>
            <div class="col-md-6 text-end">
                Time :
                <span th:text="${seatingList[0].start_time + ' to ' + seatingList[0].end_time}"></span>
            </div>
        </div>

        <div class="row info-row">
            <div class="col-md-6">
                Sem :- <span th:text="${seatingList[0].semester}"></span>
            </div>
            <div class="col-md-6 text-end">
                Total <span th:text="${seatingList.size()}"></span>
            </div>
        </div>

        <!-- Table -->
        <table>
            <thead>
            <tr>
                <th>Seat No</th>
                <th>Roll No</th>
                <th>Seat No</th>
                <th>Roll No</th>
                <th>Seat No</th>
                <th>Roll No</th>
            </tr>
            </thead>

            <tbody>

            
            <tr th:each="i : ${#numbers.sequence(0, (seatingList.size() / 3) + (seatingList.size() % 3 == 0 ? 0 : 1) - 1)}">

               
                <td th:text="${seatingList[i].seat_no}"></td>
                <td th:text="${seatingList[i].roll_no != null ? seatingList[i].roll_no : 'EMPTY'}"
                    th:classappend="${seatingList[i].roll_no == null} ? 'empty-seat'">
                </td>

                
                <td th:text="${i + ((seatingList.size() / 3) + (seatingList.size() % 3 == 0 ? 0 : 1)) < seatingList.size()} 
                               ? ${seatingList[i + ((seatingList.size() / 3) + (seatingList.size() % 3 == 0 ? 0 : 1))].seat_no} : ''">
                </td>

                <td th:text="${i + ((seatingList.size() / 3) + (seatingList.size() % 3 == 0 ? 0 : 1)) < seatingList.size()} 
                               ? ${seatingList[i + ((seatingList.size() / 3) + (seatingList.size() % 3 == 0 ? 0 : 1))].roll_no != null 
                               ? seatingList[i + ((seatingList.size() / 3) + (seatingList.size() % 3 == 0 ? 0 : 1))].roll_no : 'EMPTY'} : ''">
                </td>

                
                <td th:text="${i + 2 * ((seatingList.size() / 3) + (seatingList.size() % 3 == 0 ? 0 : 1)) < seatingList.size()} 
                               ? ${seatingList[i + 2 * ((seatingList.size() / 3) + (seatingList.size() % 3 == 0 ? 0 : 1))].seat_no} : ''">
                </td>

                <td th:text="${i + 2 * ((seatingList.size() / 3) + (seatingList.size() % 3 == 0 ? 0 : 1)) < seatingList.size()} 
                               ? ${seatingList[i + 2 * ((seatingList.size() / 3) + (seatingList.size() % 3 == 0 ? 0 : 1))].roll_no != null 
                               ? seatingList[i + 2 * ((seatingList.size() / 3) + (seatingList.size() % 3 == 0 ? 0 : 1))].roll_no : 'EMPTY'} : ''">
                </td>

            </tr>

            </tbody>
        </table>
		

        <!-- ✅ BACK BUTTON -->
        <div class="text-center my-3">
            <a th:href="@{/student/dashboard}" class="btn btn-secondary">⬅ Back to Dashboard</a>
        </div>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .login-card {
            border-radius: 15px;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-primary {
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card login-card shadow-lg p-4" style="width:400px;">

        <!-- Title -->
        <h4 class="text-center mb-3 text-primary">
            <i class="bi bi-person-circle"></i> Student Login
        </h4>

        <!-- ERROR MESSAGE -->
        <div th:if="${error}" class="alert alert-danger text-center">
            <span th:text="${error}"></span>
        </div>

        <!-- FORM -->
        <form method="post" th:action="@{/student/login}">

            <!-- Roll No -->
            <div class="mb-3">
                <label class="form-label">
                    <i class="bi bi-hash"></i> Roll Number
                </label>
                <input type="text" name="rollNo" class="form-control" placeholder="Enter Roll Number" required>
            </div>

            <!-- Password (OPTIONAL) -->
            <div class="mb-3">
                <label class="form-label">
                    <i class="bi bi-lock"></i> Password
                </label>
                <input type="password" name="password" class="form-control" placeholder="Enter Password (optional)">
                
                <!-- Default password hint -->
                <small class="text-muted">
                    Default password is your <b>Roll Number</b>
                </small>
            </div>

            <!-- Button -->
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </button>

        </form>
    </div>
</div>

</body>
</html>

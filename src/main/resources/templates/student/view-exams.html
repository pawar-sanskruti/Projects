<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Exams</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .card {
            border-radius: 12px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .badge-status {
            font-size: 12px;
            padding: 6px 10px;
        }

        .search-box {
            max-width: 300px;
        }

        .border-success {
            border-left: 5px solid #28a745 !important;
        }

        .border-warning {
            border-left: 5px solid #ffc107 !important;
        }

        .border-danger {
            border-left: 5px solid #dc3545 !important;
        }

        .section-title {
            font-weight: 600;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">📅 My Exams</span>
    <div>
        <a th:href="@{/student/dashboard}" class="btn btn-light btn-sm">⬅ Dashboard</a>
        <a th:href="@{/student/logout}" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-4">

    <!-- Header -->
    <div class="mb-4">
        <h3 class="section-title">Your Exam Schedule</h3>
        <p class="text-muted">Search, filter and track your exams easily</p>
    </div>

    <!-- Search + Filter -->
    <div class="d-flex justify-content-between flex-wrap gap-2 mb-4">

        <input type="text" id="searchInput"
               class="form-control search-box"
               placeholder="🔍 Search exam or subject">

        <select id="sessionFilter" class="form-select w-auto">
            <option value="">All Sessions</option>
            <option value="Morning">Morning</option>
            <option value="Afternoon">Afternoon</option>
        </select>

    </div>

    <!-- Exam Cards -->
    <div class="row g-4" id="examContainer">

        <div class="col-md-6 col-lg-4"
             th:each="exam : ${exams}"
             th:attr="data-session=${exam.session}">

            <div class="card shadow p-3"

                 th:classappend="
                    ${#temporals.createDate(exam.examDate.time).isAfter(today)} ? 'border-success' :
                    (${#temporals.createDate(exam.examDate.time).isEqual(today)} ? 'border-warning' :
                    'border-danger')
                 ">

                <!-- Exam Title -->
                <h5 class="fw-bold text-primary mb-2"
                    th:text="${exam.examName}"></h5>

                <!-- Subject -->
                <p class="mb-1">
                    📘 <b th:text="${exam.subjectName}"></b>
                    (<span th:text="${exam.subjectCode}"></span>)
                </p>

                <!-- Hall -->
                <p class="mb-1">
                    🏫 Hall:
                    <span th:text="${exam.hallName}"></span>
                </p>

                <!-- Date -->
                <p class="mb-1">
                    📅 <span th:text="${#temporals.format(exam.examDate, 'dd MMM yyyy')}"></span>
                </p>

                <!-- Time -->
                <p class="mb-2">
                    ⏰ <span th:text="${exam.startTime}"></span>
                    -
                    <span th:text="${exam.endTime}"></span>
                </p>

                <!-- Session -->
                <p class="mb-2">
                    🕒 Session:
                    <span class="badge bg-info text-dark"
                          th:text="${exam.session}"></span>
                </p>

                <!-- STATUS BADGE -->
                <div>

                    <!-- Upcoming -->
                    <span th:if="${#temporals.createDate(exam.examDate.time).isAfter(today)}"
                          class="badge bg-success badge-status">
                        Upcoming
                    </span>

                    <!-- Today -->
                    <span th:if="${#temporals.createDate(exam.examDate.time).isEqual(today)}"
                          class="badge bg-warning text-dark badge-status">
                        Today
                    </span>

                    <!-- Completed -->
                    <span th:if="${#temporals.createDate(exam.examDate.time).isBefore(today)}"
                          class="badge bg-danger badge-status">
                        Completed
                    </span>

                </div>

                <!-- Action Button -->
                <div class="mt-3 d-grid">
                    <a th:href="@{/student/seat}" class="btn btn-outline-primary btn-sm">
                        🎯 View Seat
                    </a>
                </div>

            </div>
        </div>

    </div>

</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3 mt-5">
    <small>© 2026 Exam Sitting Arrangement System</small>
</footer>

<!-- JS -->
<script>

    // 🔍 SEARCH
    document.getElementById("searchInput").addEventListener("keyup", function () {

        let value = this.value.toLowerCase();
        let cards = document.querySelectorAll("#examContainer .col-md-6");

        cards.forEach(card => {
            card.style.display =
                card.innerText.toLowerCase().includes(value) ? "" : "none";
        });
    });

    // 🎯 FILTER
    document.getElementById("sessionFilter").addEventListener("change", function () {

        let value = this.value;
        let cards = document.querySelectorAll("#examContainer .col-md-6");

        cards.forEach(card => {
            let session = card.getAttribute("data-session");

            card.style.display =
                (value === "" || session === value) ? "" : "none";
        });
    });

</script>

</body>
</html>
